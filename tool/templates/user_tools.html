{% extends 'base.html' %}

{%  block content %}
        <!-- Header-->
        <header class="bg-dark py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">{{ title }}</h1>
                    <p class="lead fw-normal text-white-50 mb-0">{{ subtitle }}</p>
                </div>
            </div>
        </header>


        <section class="py-5">

                <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-lg-start">
                    {% for tool in tools %}

                        <div class="col mb-5">
                            <div class="card h-100">
                                <!-- Product image-->
                                <img class="card-img-top" src="{{ tool.image.url }}" alt="..." />
                                <!-- Product details-->
                                <div class="card-body p-4">
                                    <div class="text-center">
                                        <!-- Product name-->
                                        <h5 class="fw-bolder">{{ tool.name }}</h5>

                                    </div>
                                </div>
                                <!-- Product actions-->
                                <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                                    <div class="text-center"><a class="btn btn-outline-dark mt-auto" href="{% url 'tool' tool.id %}">View tool</a></div>
                                </div>
                                <div class="card-footer d-flex justify-content-center gap-2">
                                    <a href="{% url 'tool-update' tool.id %}" class="btn btn-warning">Update</a>

                                    <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#deleteModal">
                                      Delete
                                    </button>


                                    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
                                      <div class="modal-dialog">
                                        <div class="modal-content">
                                          <div class="modal-header">
                                            <h5 class="modal-title" id="deleteModalLabel">Confirm deletion</h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                          </div>

                                          <div class="modal-body">
                                            Are you sure you want to delete this tool? This action cannot be undone.
                                          </div>

                                          <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>

                                              <form method="post" action="{% url 'tool-delete' tool.id %}">
                                                  {% csrf_token %}
                                                  <button type="submit" class="btn btn-danger">Yes, delete</button>
                                              </form>

                                          </div>
                                        </div>
                                      </div>
                                    </div>

                                </div>
                            </div>
                        </div>

                    {% endfor %}
                </div>


        </section>
{% endblock %}
