{% extends 'base.html' %}

{%  block content %}
        <!-- Header-->
        <header class="bg-dark py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">{{ title }}</h1>
                    <p class="lead fw-normal text-white-50 mb-0">{{ subtitle }}</p>
                </div>
            </div>
        </header>


        <section class="py-5">

            <div class="container px-4 px-lg-5 mt-5">

                <form method="get" class="d-flex flex-wrap gap-2 align-items-end">
                    <div>
                        <input type="text" name="city" id="city" class="form-control" placeholder="City"
                               value="{{ request.GET.city }}">
                    </div>

                    <div>
                        <input type="text" name="district" id="district" class="form-control" placeholder="District"
                               value="{{ request.GET.district }}">
                    </div>

                    <div>
                        <select name="sort" id="sort" class="form-select">
                            <option value="">-- Sort by --</option>
                            <option value="newest" {% if request.GET.sort == 'newest' %}selected{% endif %}>Newest first</option>
                            <option value="oldest" {% if request.GET.sort == 'oldest' %}selected{% endif %}>Oldest first</option>
                        </select>
                    </div>

                    <div>
                        <button type="submit" class="btn btn-dark">Apply</button>
                    </div>
                </form>
            <br/>

                <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-lg-start">
                    {% for tool in tools %}

                        <div class="col mb-5">
                            <div class="card h-100">
                                <!-- Product image-->
                                <img class="card-img-top" src="{{ tool.image.url }}" alt="..." />
                                <!-- Product details-->
                                <div class="card-body p-4">
                                    <div class="text-center">
                                        <!-- Product name-->
                                        <h5 class="fw-bolder">{{ tool.name }}</h5>

                                    </div>
                                </div>
                                <!-- Product actions-->
                                <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                                    <div class="text-center"><a class="btn btn-outline-dark mt-auto" href="{% url 'tool' tool.id %}">View tool</a></div>
                                </div>
                            </div>
                        </div>

                    {% endfor %}
                </div>
            </div>
        </section>
{% endblock %}
